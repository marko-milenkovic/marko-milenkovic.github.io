<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Livestream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* popunjava ekran bez izobličenja */
      }
    </style>
  </head>
  <body>
    <video id="video" controls autoplay></video>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      const video = document.getElementById("video");
      const urlParams = new URLSearchParams(window.location.search);
      const encodedStreamUrl = urlParams.get('stream_url');
      const streamUrl = atob(encodedStreamUrl);
      // Ako nešto stane, poziva se ovo
      function scheduleReload(reason) {
        console.warn("Reloading page because:", reason);
        setTimeout(() => {
          location.reload();
        }, 10000); // refresh posle 3 sekunde
      }
      // Pokreće HLS player
      function startPlayer() {
        if (Hls.isSupported()) {
          const hls = new Hls({
            maxBufferLength: 60,
            liveSyncDuration: 60,
            liveMaxLatencyDuration: 120
          });
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          // Ako nešto pukne, refresh
          hls.on(Hls.Events.ERROR, function(event, data) {
            console.error("HLS ERROR:", data);
            scheduleReload("HLS Error");
          });
          // Ako prestane da se učitava
          hls.on(Hls.Events.BUFFER_STALLED, () => {
            console.warn("Buffer Stalled");
            scheduleReload("Buffer stalled");
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Safari direktno pušta bez hls.js
          video.src = streamUrl;
          video.addEventListener("error", () => {
            scheduleReload("Safari video error");
          });
        }
      }
      // Ako video prestane da se pomera (buffer se ne menja)
      let lastTime = 0;
      // setInterval(() => {
      //  if (!video.paused && !video.seeking) {
      //    if (video.currentTime === lastTime) {
      //     // Stoji – zamrzlo se
      //      console.warn("Video freeze detected");
      //      scheduleReload("Video freeze");
      //   }
      //    lastTime = video.currentTime;
      //  }
      //}, 5000); // proverava svakih 5 sekundi

      if (!video.paused && !video.seeking) {
          if (video.currentTime === lastTime) {
            // Stoji – zamrzlo se
            console.warn("Video freeze detected");
            //scheduleReload("Video freeze");
          }
          lastTime = video.currentTime;
      }
      startPlayer();
    </script>
  </body>
</html>
